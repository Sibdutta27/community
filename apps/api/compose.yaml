services:
  # The backend itself — for the private-server / full-stack run.
  # Behind a profile so the default `docker compose up` still starts only the backing
  # services (postgres/minio) for local dev. Start everything with:
  #   docker compose --profile fullstack up --build
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-api
    profiles: ["fullstack"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_backend?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/community_backend?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      PORT: 3000
      S3_PROVIDER: minio
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-community}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: community-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-community};
      mc anonymous set download local/${S3_BUCKET:-community};
      exit 0
      '
    environment:
      S3_BUCKET: ${S3_BUCKET:-community}

volumes:
  postgres_data:
  minio_data:
