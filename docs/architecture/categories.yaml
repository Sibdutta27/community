# Community monorepo — App -> Domain categorization map.
#
# Purpose: a fast, machine-readable index of where each business domain lives in each
# app, so change requests can be routed to the exact files/areas efficiently.
#
# Owned/refreshed by the `community-kb` skill (run `/community-kb refresh` after the
# code structure changes). Read (never written) by the `change-router` skill.
#
# Paths reflect the apps/* monorepo layout (apps/api = backend, apps/web = member
# frontend, apps/admin = admin panel). Keep them in sync when modules/routes/pages move.

apps:
  backend:
    root: apps/api
    stack: "NestJS 11 + Prisma 7 (Postgres), JWT, S3/MinIO"
    note: "Single source of truth. Change API/DTO here before either frontend."
  web:
    root: apps/web
    stack: "Next.js 16 (App Router) + React 19, Tailwind v4, shadcn/ui"
    note: "Member-facing. Proxies the backend via BFF route handlers in src/app/api."
  admin:
    root: apps/admin
    stack: "Vite 6 + React 19 (plain JS), MUI v9"
    note: "Internal staff dashboard."

domains:
  auth:
    desc: "Registration, login (member + admin), JWT issue/verify, sessions, route guards."
    docs: [docs/architecture/backend.md, docs/architecture/frontend.md]
    backend: [apps/api/src/modules/auth]
    web:
      - apps/web/src/app/(auth)
      - apps/web/src/features/auth
      - apps/web/src/app/api/auth
      - apps/web/src/middleware.ts
      - apps/web/src/lib/auth.ts
      - apps/web/src/lib/auth-session.ts
    admin:
      - apps/admin/src/pages/Login
      - apps/admin/src/api/auth.api.js
      - apps/admin/src/routes

  enrollment:
    desc: "4-step enrollment flow + lifecycle DRAFT->SUBMITTED->APPROVED/REJECTED; addresses, contacts, maternal lineage."
    docs: [docs/architecture/backend.md, docs/data-model.md]
    backend: [apps/api/src/modules/enrollment]
    web:
      - apps/web/src/app/(protected)/enrollment
      - apps/web/src/app/(public)/enrollment
      - apps/web/src/features/enrollment
      - apps/web/src/app/api/enrollment
    admin:
      - apps/admin/src/pages/Enrollments
      - apps/admin/src/api/enrollment.api.js

  consent:
    desc: "Versioned consent templates + acceptance gating (ConsentAcceptedGuard) before personal-data writes."
    docs: [docs/architecture/backend.md]
    backend: [apps/api/src/modules/consent]
    web: [apps/web/src/app/api/consent]
    admin:
      - apps/admin/src/pages/Consents
      - apps/admin/src/api/consent.api.js

  documents:
    desc: "Typed file upload/list/delete to S3/MinIO; single- vs multi-file rules; review status."
    docs: [docs/architecture/backend.md]
    backend:
      - apps/api/src/modules/document
      - apps/api/src/common/s3
    web: [apps/web/src/app/api/document]
    admin: []

  services:
    desc: 'Service ("Programs" in admin copy) catalog + categories + member registration; admin CRUD + registrant roster/CSV.'
    docs: [docs/architecture/backend.md, docs/architecture/admin-panel.md]
    backend:
      - apps/api/src/modules/service
      - apps/api/src/modules/admin/adminService
    web:
      - apps/web/src/app/(public)/services
      - apps/web/src/features/services
      - apps/web/src/app/api/services
    admin:
      - apps/admin/src/pages/Services
      - apps/admin/src/pages/Services/ServiceRegistrations
      - apps/admin/src/pages/ServiceCategories
      - apps/admin/src/api/service.api.js
      - apps/admin/src/api/serviceCat.api.js

  events:
    desc: "Event catalog + categories + member registration; admin CRUD, month calendar, registrant roster/CSV."
    docs: [docs/architecture/backend.md, docs/architecture/admin-panel.md]
    backend:
      - apps/api/src/modules/event
      - apps/api/src/modules/admin/adminEvent
    web: [apps/web/src/app/api/events]
    admin:
      - apps/admin/src/pages/Events
      - apps/admin/src/pages/Events/components/EventCalendar
      - apps/admin/src/pages/Events/EventRegistrations
      - apps/admin/src/pages/EventCategories
      - apps/admin/src/api/event.api.js
      - apps/admin/src/api/eventCat.api.js

  profile:
    desc: "Member profile, dashboard, account info, photo upload, user records, yucayeke territory map (protected /yucayeke/map + profile Your Yucayeke card)."
    docs: [docs/architecture/backend.md, docs/architecture/frontend.md]
    backend:
      - apps/api/src/modules/profile
      - apps/api/src/modules/user
      - apps/api/src/modules/account
    web:
      - apps/web/src/app/(protected)/my-profile
      - apps/web/src/app/(protected)/profile
      - apps/web/src/app/(protected)/dashboard
      - apps/web/src/app/(protected)/yucayeke
      - apps/web/src/features/profile
      - apps/web/src/features/dashboard
      - apps/web/src/features/yucayeke # member map experience (feature shared with marketing-content's public page)
      - apps/web/public/geo
      - data/naming/yucayeke-names # BTF's official yucayeke names (CSV is the contract code reads)
      - apps/web/src/app/api/profile
      - apps/web/src/app/api/account
    admin:
      - apps/admin/src/pages/Users
      - apps/admin/src/pages/Dashboard
      - apps/admin/src/api/user.api.js
      - apps/admin/src/api/account.api.js

  cultural-connection:
    desc: "Cultural connections + maternal lineage (captured in the enrollment step)."
    docs: [docs/architecture/backend.md, docs/data-model.md]
    backend: [apps/api/src/modules/enrollment]
    web: [apps/web/src/features/enrollment]
    admin:
      - apps/admin/src/pages/CulturalConnections
      - apps/admin/src/api/culturalConnection.api.js

  feedback:
    desc: "In-app feedback / work-order widget: floating launcher + panel, optional screenshot, auto-captured page URL + locale. Accepts signed-out submissions. Staff read + triage it in the admin panel (FeedbackStatus lanes)."
    docs:
      [
        docs/architecture/backend.md,
        docs/architecture/frontend.md,
        docs/architecture/admin-panel.md,
      ]
    backend:
      - apps/api/src/modules/feedback
      - apps/api/src/modules/auth/guards/optionalAuth.guard.ts
      - apps/api/src/modules/admin/adminFeedback
    web:
      - apps/web/src/features/feedback
      - apps/web/src/app/api/feedback
      - apps/web/src/components/shared/support-section.tsx
      - apps/web/src/components/shared/support-feedback-button.tsx
    admin:
      - apps/admin/src/pages/Feedback
      - apps/admin/src/api/feedback.api.js

  admin-management:
    desc: "Backend admin CRUD surface + admin-panel shell (layout/nav/section bar) + roster CSV export."
    docs: [docs/architecture/admin-panel.md]
    backend:
      - apps/api/src/modules/admin
      - apps/api/src/common/utils/csv.util.ts # shared CSV writer (quoting, BOM, formula-injection)
    admin:
      - apps/admin/src/pages
      - apps/admin/src/layouts
      - apps/admin/src/components/SectionNav # section bar: route links + local view toggle
      - apps/admin/src/components/Registrants # shared registrant table + CSV export button
      - apps/admin/src/utils/downloadFile.util.js

  marketing-content:
    desc: "Public/marketing pages (no domain backend): about, community, yucayeke, contact, landing, policies."
    docs: [docs/architecture/frontend.md]
    web:
      - apps/web/src/app/(public)/about
      - apps/web/src/app/(public)/community
      - apps/web/src/app/(public)/yucayeke
      - apps/web/src/app/(public)/contact
      - apps/web/src/app/(public)/cookie-policy
      - apps/web/src/app/(public)/privacy-policy
      - apps/web/src/app/(public)/terms-of-service
      - apps/web/src/features/home
      - apps/web/src/features/about
      - apps/web/src/features/community
      - apps/web/src/features/contact
      - apps/web/src/features/yucayeke

cross-cutting:
  data-model:
    desc: "Prisma schema — source of truth for models/relations/enums."
    backend: [apps/api/prisma/schema.prisma]
    doc: docs/data-model.md
  design-system:
    desc: "Two deliberately separate systems — never cross-pollinate."
    web:
      - apps/web/src/styles
      - apps/web/src/components/ui
      - apps/web/src/lib/motion.ts
    admin:
      - apps/admin/src/styles
      - apps/admin/src/components/ui
    docs: [docs/design-system.md, docs/design-system-admin.md]
  http-client:
    desc: "Axios clients + endpoint catalogs."
    web:
      - apps/web/src/services/http
      - apps/web/src/app/api/_shared
    admin: [apps/admin/src/api/client.js]
  infra:
    desc: "DB client, config, local infra (Postgres + MinIO)."
    backend:
      - apps/api/src/database
      - apps/api/src/config
      - apps/api/compose.yaml
